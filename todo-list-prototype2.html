<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Todo List — Static</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Embedded CSS taken from src/index.css (trimmed for a single file use) */
    body {
      background: #000000;
      min-height: 100vh;
      font-family: 'Orbitron', sans-serif;
      color: #00e7ff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    .container {
      background: rgba(5, 5, 5, 0.95);
      backdrop-filter: blur(20px);
      padding: 2rem;
      width: 100%;
      min-height: 100vh;
      box-sizing: border-box;
      border: none;
      box-shadow: none;
      animation: fadeIn 1s ease-out forwards;
    }

    h1 {
      font-size: 3rem;
      text-align: center;
      margin: 1rem 0 2rem;
      color: #00e7ff;
      text-shadow: 0 0 25px rgba(0, 231, 255, 0.9), 0 0 40px rgba(0, 231, 255, 0.6);
      letter-spacing: 3px;
      overflow: hidden;
      white-space: nowrap;
      animation: typing 2s steps(20, end) forwards, glow 2s ease-in-out infinite alternate;
    }

    .todo-input {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      padding: 0 2rem;
      opacity: 0;
      transform: translateY(20px);
      animation: slideUp 1s ease-out 0.5s forwards;
    }

    #new-task {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      color: #00e7ff;
      font-size: 1.1rem;
      font-family: 'Orbitron', sans-serif;
      transition: all 0.3s ease;
      box-shadow: 0 0 12px rgba(0, 231, 255, 0.4);
    }

    #new-task:focus {
      outline: none;
      box-shadow: 0 0 20px rgba(0, 231, 255, 0.8);
      background: rgba(255, 255, 255, 0.1);
    }

    #new-task::placeholder {
      color: rgba(0, 231, 255, 0.4);
    }

    #add-btn {
      padding: 15px 30px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(45deg, #00e7ff, #00b4d8);
      color: #fff;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(0, 231, 255, 0.7), 0 0 30px rgba(0, 231, 255, 0.5);
    }

    #add-btn:hover {
      background: linear-gradient(45deg, #00b4d8, #0088a9);
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(0, 231, 255, 0.9), 0 0 40px rgba(0, 231, 255, 0.6);
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 0 2rem;
    }

    .todo-item {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      padding: 1rem;
      border-radius: 12px;
      transition: all 0.3s ease;
      border: 1px solid rgba(0, 231, 255, 0.2);
      box-shadow: 0 0 12px rgba(0, 231, 255, 0.3);
      opacity: 0;
      transform: translateX(-20px);
      animation: slideIn 0.8s ease-out forwards;
    }

    .task-text {
      margin: 0;
      font-size: 1.2rem;
      color: #00e7ff;
      text-shadow: 0 0 15px rgba(0, 231, 255, 0.9), 0 0 25px rgba(0, 231, 255, 0.6);
      flex-grow: 1;
      text-align: left;
      line-height: 1.5;
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      margin-right: 1.5rem;
    }

    .task-text.completed {
      text-decoration: line-through;
      color: rgba(0, 231, 255, 0.5);
      text-shadow: 0 0 10px rgba(0, 231, 255, 0.5);
    }

    .task-input {
      margin: 0;
      font-size: 1.2rem;
      color: #00e7ff;
      text-shadow: 0 0 15px rgba(0, 231, 255, 0.9), 0 0 25px rgba(0, 231, 255, 0.6);
      flex-grow: 1;
      text-align: left;
      line-height: 1.5;
      background: rgba(255, 255, 255, 0.05);
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-family: 'Orbitron', sans-serif;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(0, 231, 255, 0.4);
      margin-right: 1.5rem;
    }

    .task-input:focus {
      outline: none;
      box-shadow: 0 0 15px rgba(0, 231, 255, 0.8);
      background: rgba(255, 255, 255, 0.1);
    }

    .actions {
      display: flex;
      gap: 0.5rem;
      flex-shrink: 0;
      align-items: center;
    }

    .edit-btn,
    .complete-btn,
    .delete-btn,
    .details-btn {
      border: none;
      background: linear-gradient(45deg, #00e7ff, #00b4d8);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 231, 255, 0.7), 0 0 25px rgba(0, 231, 255, 0.4);
      line-height: 1;
      min-width: 36px;
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(0, 231, 255, 0.4);
      animation: pulse 3s ease-in-out forwards;
    }

    .edit-btn:hover,
    .complete-btn:hover,
    .delete-btn:hover,
    .details-btn:hover {
      background: linear-gradient(45deg, #00b4d8, #0088a9);
      box-shadow: 0 0 20px rgba(0, 231, 255, 0.9), 0 0 35px rgba(0, 231, 255, 0.6);
      transform: scale(1.05);
      border: 1px solid rgba(0, 231, 255, 0.6);
    }

    .no-tasks {
      font-size: 1.2rem;
      color: rgba(0, 231, 255, 0.7);
      text-shadow: 0 0 15px rgba(0, 231, 255, 0.7), 0 0 25px rgba(0, 231, 255, 0.4);
      text-align: center;
      margin: 2rem 0;
      padding: 1rem;
      opacity: 0;
      transform: translateX(-20px);
      animation: slideIn 0.8s ease-out 0.8s forwards;
    }

    .todo-item.deleting {
      animation: fadeOut 0.5s ease-out forwards;
    }

    /* New styles for the notifications container */
    #notifications {
      position: fixed;
      bottom: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1000;
    }

    /* Styles for each notification */
    .notification {
      background: rgba(5, 5, 5, 0.95);
      padding: 1rem;
      border-radius: 12px;
      color: #00e7ff;
      box-shadow: 0 0 20px rgba(0, 231, 255, 0.5);
      align-items: center;
      gap: 1rem;
      font-family: 'Orbitron', sans-serif;
      border: 1px solid rgba(0, 231, 255, 0.2);
      transition: opacity 0.5s ease-out, transform 0.5s ease-out, max-height 0.5s ease-out, padding 0.5s ease-out;
    }

    .notify-text {
      margin: 0;
      font-size: 1.1rem;
      text-shadow: 0 0 15px rgba(0, 231, 255, 0.7);
    }

    .undo-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(45deg, #00e7ff, #00b4d8);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 231, 255, 0.7), 0 0 25px rgba(0, 231, 255, 0.4);
    }

    .undo-btn:hover {
      background: linear-gradient(45deg, #00b4d8, #0088a9);
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(0, 231, 255, 0.9), 0 0 35px rgba(0, 231, 255, 0.6);
    }

    /* Details popup styles */
    #details-popup {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      opacity: 0;
      transform: scale(0.85) translateY(12px);
      transition: opacity 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275),
        transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #details-popup.show {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    @keyframes fadeOut {
      from {
        opacity: 1;
        transform: translateX(0);
      }

      to {
        opacity: 0;
        transform: translateX(20px);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes typing {
      from {
        width: 0;
      }

      to {
        width: 100%;
      }
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 15px rgba(0, 231, 255, 0.7), 0 0 25px rgba(0, 231, 255, 0.4);
      }

      to {
        text-shadow: 0 0 25px rgba(0, 231, 255, 0.9), 0 0 40px rgba(0, 231, 255, 0.6);
      }
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 15px rgba(0, 231, 255, 0.7), 0 0 25px rgba(0, 231, 255, 0.4);
      }

      50% {
        box-shadow: 0 0 20px rgba(0, 231, 255, 0.9), 0 0 35px rgba(0, 231, 255, 0.6);
      }

      100% {
        box-shadow: 0 0 15px rgba(0, 231, 255, 0.7), 0 0 25px rgba(0, 231, 255, 0.4);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Todo List</h1>

    <div class="todo-input">
      <input id="new-task" type="text" placeholder="Add a task" />
      <button id="add-btn">Add</button>
    </div>

    <div class="todo-list">
      <div class="todo-item" style="animation: slideIn 0.8s ease-out 0.1s forwards;">
        <p class="task-text">Buy groceries</p>
        <div class="actions">
          <button class="edit-btn">✎</button>
          <button class="complete-btn">✔</button>
          <button class="details-btn">!</button>
          <button class="delete-btn">✖</button>
        </div>
      </div>

      <div class="todo-item" style="animation: slideIn 0.8s ease-out 0.3s forwards;">
        <p class="task-text completed">Call Alice</p>
        <div class="actions">
          <button class="edit-btn">✎</button>
          <button class="complete-btn">✔</button>
          <button class="details-btn">!</button>
          <button class="delete-btn">✖</button>
        </div>
      </div>

      <div class="todo-item" style="animation: slideIn 0.8s ease-out 0.5s forwards;">
        <p class="task-text">Finish project</p>
        <div class="actions">
          <button class="edit-btn">✎</button>
          <button class="complete-btn">✔</button>
          <button class="details-btn">!</button>
          <button class="delete-btn">✖</button>
        </div>
      </div>
      <div id="details-popup"
        style="display: none; position: fixed; z-index: 2000; background: rgba(5, 5, 5, 0.95); backdrop-filter: blur(20px); padding: 12px 18px; border-radius: 10px; color: #00e7ff; box-shadow: 0 0 25px rgba(0, 231, 255, 0.6); border: 1px solid rgba(0, 231, 255, 0.2); font-size: 0.95rem; text-align: center; line-height: 1.35; min-width: 135px; box-sizing: border-box;">
        Details:<br>
        01/01/2026<br>
        00:00
      </div>
    </div>

  </div>

  <div id="notifications"></div>

  <!-- Smaller square popup (compact size, positioned right above the task bar / todo-item) -->


  <script>
    const deleteBtns = document.querySelectorAll('.delete-btn');
    const notificationsContainer = document.getElementById('notifications');

    function startExit(notification) {
      notification.style.maxHeight = `${notification.offsetHeight}px`;
      requestAnimationFrame(() => {
        notification.style.maxHeight = '0px';
        notification.style.padding = '0';
        notification.style.opacity = '0';
        notification.style.transform = 'translateX(-100px) scale(0.8)';
      });
    }

    deleteBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const notification = document.createElement('div');
        notification.classList.add('notification');
        notification.innerHTML = `
          <p class="notify-text">Task deleted</p>
          <button class="undo-btn">Undo</button>
        `;

        const undoBtn = notification.querySelector('.undo-btn');

        notification.addEventListener('transitionend', (e) => {
          if (e.propertyName === 'max-height' && notification.style.maxHeight === '0px') {
            notification.remove();
          }
        });

        undoBtn.addEventListener('click', () => {
          clearTimeout(notification.hideTimeout);
          startExit(notification);
        });

        notification.style.opacity = '0';
        notification.style.transform = 'translateX(-100px) scale(0.8)';
        notification.style.display = 'flex';
        notificationsContainer.appendChild(notification);
        requestAnimationFrame(() => {
          notification.style.opacity = '1';
          notification.style.transform = 'translateX(0) scale(1)';
        });

        notification.hideTimeout = setTimeout(() => {
          startExit(notification);
        }, 5000);
      });
    });

    /* === Details exclamation button (smaller square, positioned right above the task bar / todo-item) === */
    const detailsBtns = document.querySelectorAll('.details-btn');
    const detailsPopup = document.getElementById('details-popup');
    let activeDetailsBtn = null;
    let transitionInProgress = false;   // ← prevents spam-click animation chaos

    const hideDetailsPopup = () => {
      if (!detailsPopup.classList.contains('show')) return;

      detailsPopup.classList.remove('show');
      transitionInProgress = true;

      detailsPopup.addEventListener('transitionend', function handler(e) {
        if (e.propertyName === 'opacity') {
          detailsPopup.style.display = 'none';
          activeDetailsBtn = null;
          transitionInProgress = false;
          detailsPopup.removeEventListener('transitionend', handler);
        }
      }, { once: true });
    };

    detailsBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopImmediatePropagation();

        // Ignore clicks while any open/close animation is running
        if (transitionInProgress) return;

        // Toggle: if already open for this exact button → close it
        if (detailsPopup.classList.contains('show') && activeDetailsBtn === btn) {
          hideDetailsPopup();
          return;
        }

        // Show / reposition for this button
        detailsPopup.style.display = 'block';

        requestAnimationFrame(() => {
          const btnRect = btn.getBoundingClientRect();
          const itemRect = btn.closest('.todo-item').getBoundingClientRect(); // task bar / frame
          const popupRect = detailsPopup.getBoundingClientRect();

          // Horizontal: centered on the exclamation button
          let left = btnRect.left + (btnRect.width / 2) - (popupRect.width / 2);
          // Vertical: flush right above the entire task bar (todo-item)
          let top = itemRect.top - popupRect.height - 10;

          // Keep inside viewport
          if (left < 10) left = 10;
          if (left + popupRect.width > window.innerWidth - 10) {
            left = window.innerWidth - popupRect.width - 10;
          }
          if (top < 10) top = 10;

          detailsPopup.style.left = `${left}px`;
          detailsPopup.style.top = `${top}px`;

          // Trigger opening animation
          detailsPopup.classList.add('show');
          activeDetailsBtn = btn;
          transitionInProgress = true;

          // Clear the "in progress" flag when opening animation finishes
          detailsPopup.addEventListener('transitionend', function handler(e) {
            if (e.propertyName === 'opacity') {
              transitionInProgress = false;
              detailsPopup.removeEventListener('transitionend', handler);
            }
          }, { once: true });
        });
      });
    });

    // Click anywhere outside the popup or the exclamation buttons to close it
    document.addEventListener('click', (e) => {
      if (detailsPopup.classList.contains('show') &&
        !detailsPopup.contains(e.target) &&
        !Array.from(detailsBtns).some(b => b.contains(e.target))) {
        hideDetailsPopup();
      }
    });
  </script>
</body>

</html>
