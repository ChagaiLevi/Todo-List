<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <link rel="stylesheet" href="style/style.css">
</head>

<body>
  <div class="container">
    <h1>Todo List</h1>
    <div class="todo-input">
      <input type="text" id="new-task" placeholder="Add a task" />
      <button id="add-btn">Add</button>
    </div>
    <div class="todo-list">
      <div class="todo-item">
        <p class="task-text">Complete the project work that needs more space and longer descriptions.</p>
        <div class="actions">
          <button class="edit-btn">✎</button>
          <button class="complete-btn">✔</button>
          <button class="delete-btn">✖</button>
        </div>
      </div>
      <div class="todo-item">
        <p class="task-text">Check all the emails for the day and respond accordingly.</p>
        <div class="actions">
          <button class="edit-btn">✎</button>
          <button class="complete-btn">✔</button>
          <button class="delete-btn">✖</button>
        </div>
      </div>
      <div class="todo-item">
        <p class="task-text">Learn about new technologies such as AI, machine learning, and blockchain.</p>
        <div class="actions">
          <button class="edit-btn">✎</button>
          <button class="complete-btn">✔</button>
          <button class="delete-btn">✖</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>

</html>
